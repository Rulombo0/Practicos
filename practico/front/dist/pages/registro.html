<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | RuloLibros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- formulario de registro -->

    <main class="contenedor_auth">

        <section class="tarjeta_auth">

            <div class="tarjeta_auth-encabezado">
                <img src="../../assets/img/logo.png" class="tarjeta_auth-logo" alt="Logo de RuloLibros">
                <h1>Crear cuenta</h1>
            </div>

            <div class="tarjeta_auth-cuerpo">

                <div id="alerta-registro" class="alert d-none" role="alert"></div>

                <form id="form-registro">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" maxlength="50" required autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña (mínimo 6 caracteres)</label>
                        <input type="password" class="form-control" id="password" minlength="6" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-auth w-100">Crear cuenta</button>

                </form>

                <p class="tarjeta_auth-pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

            </div>

        </section>

    </main>

    <script src="../js/api.js"></script>

    <script src="../js/registro.js"></script>

</body>

</html>
